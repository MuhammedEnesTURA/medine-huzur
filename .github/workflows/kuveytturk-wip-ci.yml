name: Kuveyt Turk WIP CI

on:
  push:
    branches:
      - kuveytturk-integration-wip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/MedineHuzur.slnx
      - name: Build
        run: dotnet build backend/MedineHuzur.slnx -c Release --no-restore
      - name: Test
        run: dotnet test backend/tests/Web.Tests/Web.Tests.csproj -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.medinehuzur.com
      PAYMENT_PROVIDER_ACTIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
